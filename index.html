---
layout: default
title: "Home"
---

<header class="page-header">
    <h1>{{ site.data.index_data.welcome_title }}</h1>
    <p class="subtitle">{{ site.data.index_data.welcome_text }}</p>
</header>

<section class="grid-container">
    {% for item in site.data.index_data.sections %}
    <article class="card">
        {% if item.badge %}
        <span class="card-badge">{{ item.badge }}</span>
        {% endif %}
        <h3>{{ item.title }}</h3>
        <p>{{ item.description }}</p>
    </article>
    {% endfor %}
</section>
