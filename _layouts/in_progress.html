---
layout: default
---

<div class="in-progress-container">
    <div class="in-progress-card">
        <div class="in-progress-badge">Work in Progress</div>

        <h1>{{ page.title }}</h1>

        <p class="in-progress-message">
            {% if page.description %}
            {{ page.description }}
            {% else %}
            This page is currently in the works. Please check back soon for more details!
            {% endif %}
        </p>

        <div class="in-progress-actions">
            <a href="{{ '/' | relative_url }}" class="btn-primary">&larr; Return to Home</a>
        </div>
    </div>
</div>
